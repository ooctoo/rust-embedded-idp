name: N2 functional regression

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  functional-arm64:
    name: CI-FUNC-ARM64-01
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      N2_WORK: ${{ runner.temp }}/idp-n2-ci-${{ github.run_id }}-${{ github.run_attempt }}
      N2_PUBLIC: ${{ runner.temp }}/n2-public/${{ github.run_id }}/${{ github.run_attempt }}
      TMPDIR: ${{ runner.temp }}/idp-n2-ci-${{ github.run_id }}-${{ github.run_attempt }}/tmp
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/idp-n2-ci-${{ github.run_id }}-${{ github.run_attempt }}/browsers
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '30000'
      CARGO_BUILD_JOBS: '2'
      CI: 'true'
    steps:
      - name: Initialize private work and public evidence roots
        timeout-minutes: 1
        run: |
          python3 -B - <<'PY'
          import os
          import re
          import time
          from pathlib import Path
          run_id, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
          if not all(re.fullmatch(r'[1-9][0-9]*', value) for value in [run_id, attempt]):
              raise RuntimeError('Invalid run identity')
          root = Path(os.environ['RUNNER_TEMP']).resolve()
          work = root / f'idp-n2-ci-{run_id}-{attempt}'
          public = root / 'n2-public' / run_id / attempt
          if Path(os.environ['N2_WORK']) != work or Path(os.environ['N2_PUBLIC']) != public:
              raise RuntimeError('CI initialization path mismatch')
          paths = [work, work / 'tmp', public, work / 'job-started-at']
          for path in paths:
              if any(part.is_symlink() for part in [path, *path.parents]):
                  raise RuntimeError('CI initialization symlink rejected')
          os.umask(0o077)
          for path in [work, work / 'tmp', public]:
              path.mkdir(parents=True, exist_ok=True, mode=0o700)
              if path.stat().st_mode & 0o077:
                  raise RuntimeError('CI roots require owner-only permissions')
          (work / 'job-started-at').write_text(str(time.time()) + '\n')
          PY

      - name: Checkout reviewed ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24 action runtime
        timeout-minutes: 3
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Select frozen Node tool runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; Node 24 action runtime
        timeout-minutes: 3
        with:
          node-version: '22.23.4'
          architecture: arm64
          check-latest: false
          package-manager-cache: false

      - name: Activate frozen pnpm
        timeout-minutes: 2
        run: |
          corepack enable
          corepack prepare pnpm@10.30.1 --activate
          test "$(node --version)" = v22.23.4
          test "$(pnpm --version)" = 10.30.1

      - name: Validate tooling offline
        timeout-minutes: 3
        run: |
          python3 -B scripts/test_management_n2_tools.py
          python3 -B scripts/test_management_n2_linux_tools.py
          python3 -B scripts/test_management_n2_ci.py
          python3 -B scripts/test_n2_ci_processes.py
          node scripts/test_management_functional.mjs

      - name: Install locked tools and paired full Chromium
        timeout-minutes: 8
        run: |
          pnpm --dir scripts/n2-ci install --frozen-lockfile --ignore-scripts --config.engine-strict=true --config.fetch-retries=1 --config.fetch-timeout=30000
          pnpm --dir scripts/n2-ci exec playwright install --with-deps --no-shell chromium

      - name: Preflight and build isolated arm64 images
        timeout-minutes: 35
        run: python3 -B scripts/run_management_n2_ci.py prepare --work "$N2_WORK" --output "$N2_PUBLIC"

      - name: Run eight isolated functional suites
        timeout-minutes: 64
        run: python3 -B scripts/run_management_n2_ci.py run --work "$N2_WORK" --output "$N2_PUBLIC"

      - name: Finalize cleanup and sanitized evidence
        id: finalize
        if: ${{ always() }}
        timeout-minutes: 10
        env:
          IDP_N2_JOB_STATUS: ${{ job.status }}
        run: |
          if test -f scripts/run_management_n2_ci.py; then
            if python3 -B scripts/run_management_n2_ci.py finalize --work "$N2_WORK" --output "$N2_PUBLIC"; then
              printf 'public-path=%s\n' "$N2_PUBLIC" >> "$GITHUB_OUTPUT"
              exit 0
            else
              n2_finalize_status=$?
            fi
          else
            n2_finalize_status=1
          fi
          # Preserve a failed run's sealed, sanitized publication; otherwise create
          # only a constant failure marker in this exact run's public root.
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          import stat
          from pathlib import Path, PurePosixPath
          run_id = os.environ['GITHUB_RUN_ID']
          attempt = os.environ['GITHUB_RUN_ATTEMPT']
          if not all(re.fullmatch(r'[1-9][0-9]*', value) for value in [run_id, attempt]):
              raise RuntimeError('Invalid run identity for safe failure artifact')
          root = Path(os.environ['RUNNER_TEMP']).resolve()
          public = root / 'n2-public' / run_id / attempt
          if Path(os.environ['N2_PUBLIC']) != public:
              raise RuntimeError('Public failure artifact root mismatch')
          if any(path.is_symlink() for path in [public, *public.parents]):
              raise RuntimeError('Public failure artifact ancestor symlink rejected')
          for directory in [root / 'n2-public', root / 'n2-public' / run_id, public]:
              if directory.is_symlink():
                  raise RuntimeError('Public failure artifact symlink rejected')
              directory.mkdir(exist_ok=True, mode=0o700)
              if not stat.S_ISDIR(directory.lstat().st_mode):
                  raise RuntimeError('Public failure artifact directory required')
          os.chmod(public, 0o700)
          def valid_publication():
              try:
                  marker = public / 'publication.json'
                  if marker.is_symlink() or not marker.is_file():
                      return False
                  manifest = json.loads(marker.read_text(encoding='utf-8'))
                  if not isinstance(manifest, dict):
                      return False
                  if type(manifest.get('schemaVersion')) is not int or manifest['schemaVersion'] != 1 or manifest.get('sanitized') is not True:
                      return False
                  files = manifest.get('files')
                  if not isinstance(files, dict) or not files:
                      return False
                  for relative, digest in files.items():
                      path = PurePosixPath(relative)
                      if path.is_absolute() or str(path) != relative or any(part in ['.', '..'] for part in path.parts) or relative == 'publication.json':
                          return False
                      if not isinstance(digest, str) or not re.fullmatch(r'[a-f0-9]{64}', digest):
                          return False
                  actual = set()
                  for path in public.rglob('*'):
                      if path.is_symlink() or not (path.is_file() or path.is_dir()):
                          return False
                      if path.is_file() and path != public / 'publication.json':
                          actual.add(path.relative_to(public).as_posix())
                  if actual != set(files):
                      return False
                  if not all(hashlib.sha256((public / relative).read_bytes()).hexdigest() == digest for relative, digest in files.items()):
                      return False
                  # A later journal/write failure must not preserve a misleading
                  # passing pack from a finalizer that returned nonzero.
                  summary = json.loads((public / 'final-summary.json').read_text(encoding='utf-8'))
                  return isinstance(summary, dict) and summary.get('status') == 'failed'
              except (OSError, ValueError, TypeError, UnicodeError):
                  return False
          if not valid_publication():
              for child in public.iterdir():
                  if child.is_symlink() or not child.is_dir():
                      child.unlink()
                  else:
                      shutil.rmtree(child)
              evidence = public / 'bootstrap-failure.json'
              evidence.write_text(json.dumps({
                  'status': 'failed',
                  'phase': 'checkout_or_finalize_unavailable',
                  'functional_execution': 'not_completed',
                  'cleanup_status': 'unknown',
                  'evidence_complete': False,
              }, indent=2) + '\n', encoding='utf-8')
              os.chmod(evidence, 0o600)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write(f'public-path={public}\n')
          PY
          exit "$n2_finalize_status"

      - name: Upload public evidence whitelist
        id: evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; Node 24 action runtime
        timeout-minutes: 5
        with:
          name: n2-functional-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-arm64
          path: ${{ steps.finalize.outputs.public-path }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30
          overwrite: false

      - name: Verify functional and delivery gates
        if: ${{ always() }}
        timeout-minutes: 1
        env:
          IDP_N2_JOB_STATUS: ${{ job.status }}
          IDP_N2_ARTIFACT_OUTCOME: ${{ steps.evidence.outcome }}
          IDP_N2_ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          IDP_N2_ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          IDP_N2_ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          test -f scripts/run_management_n2_ci.py
          test "$IDP_N2_ARTIFACT_OUTCOME" = success
          test -n "$IDP_N2_ARTIFACT_ID"
          python3 -B scripts/run_management_n2_ci.py verify --work "$N2_WORK" --output "$N2_PUBLIC"
