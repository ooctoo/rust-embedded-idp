[package]
name = "embedded-idp-no-tenant-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Local business host demonstrating embedded IdP authorization"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
embedded-idp-axum = { version = "3.0.0", path = "../../crates/embedded-idp-axum" }
embedded-idp-core = { version = "3.0.0", path = "../../crates/embedded-idp-core" }
embedded-idp-security = { version = "3.0.0", path = "../../crates/embedded-idp-security" }
embedded-idp-storage-postgres = { version = "3.0.0", path = "../../crates/embedded-idp-storage-postgres" }
postgres = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "net", "rt-multi-thread"] }
